<div mat-dialog-content>
    <h3>Agregar Productos</h3>
    <div class="row">
        <div class="col-4"><mat-form-field appearance="outline">
            <mat-label>Categorias</mat-label>
                  <mat-select name="id-categoria" value="" (selectionChange)="seleccionarCategoria($event)">
                    <mat-option value="" selected>Categoría</mat-option>
                    <mat-option *ngFor="let cat of dataCategoria" [value]="cat.id">{{cat.nombre}}</mat-option>
              </mat-select>
          </mat-form-field></div>
        <div class="col-4">  <mat-form-field appearance="outline">
            <mat-label>Subcategorias</mat-label>
            <mat-select name="id_subcategoria" value="" (selectionChange)="seleccionarSubcategoria($event)">
              <mat-option value="" selected>Sub Categoría</mat-option>
              <mat-option *ngFor="let subcat of dataSubCategoria" [value]="subcat.id">{{subcat.nombre}}</mat-option>
        </mat-select>
        </mat-form-field></div>
        <div class="col-4">
           <mat-form-field appearance="outline">
                <mat-label>Familia</mat-label>
                <mat-select name="id_subcategoria" value="" (selectionChange)="seleccionarFamilia($event)">
                  <mat-option value="" selected>Familia</mat-option>
                  <mat-option *ngFor="let fam of dataFamilia" [value]="fam.id">{{fam.nombre}}</mat-option>
            </mat-select>
            </mat-form-field>
        </div>
    </div>
<div class="row">
    <div class="col-12">
        <mat-form-field appearance="outline">
            <mat-label>Buscar Producto</mat-label>

            <mat-select name="id_producto" formControlName="producto"  (selectionChange)="seleccionarProducto(
                $event)">

                <input matInput class="buscador" (keydown.space)="$event.stopPropagation()" (keyup)="onKey($event.target.value)" placeholder="Buscar por nombre o código">
               <mat-option  value="0"></mat-option>
                <mat-option *ngFor="let cat of dataProductos" [value]="cat.id">{{cat.nombre}}</mat-option>
            </mat-select>

        </mat-form-field>

    </div>
</div>
<div class="row">
<div class="col-6"><mat-form-field appearance="outline">
    <mat-label>Cantidad</mat-label>
      <input matInput  name="cantidad" [(ngModel)]="data.cantidad" type="number">
    </mat-form-field></div>
<div class="col-6">
    <mat-form-field appearance="outline">
        <mat-label>Precio</mat-label>
          <input matInput  [(ngModel)]="data.precio" name="precio" type="number">
        </mat-form-field>
</div>
<div class="col-12">
    <div mat-dialog-actions>
        <button mat-button (click)="cancelar()">Cancelar</button>
        <button mat-raised-button [mat-dialog-close]="data" cdkFocusInitial>Agregar</button>
    </div>
</div>
</div>


</div>
